  <!-- P2P Core Logic Code -->
  <script>
    let peer = null;
    let conn = null;
    let roomCode = "";
    let isHost = false;
    let currentUser = "User_" + Math.floor(100 + Math.random() * 900);
    let masterMuted = false;
    let timerInterval = null;
    let timerSecondsRemaining = 0;
    let audioCtx = null;
    const ambientNodes = {};
    let ytPlayer = null;
    let isYoutubeReady = false;
    let isSyncing = false;
    let isDrawing = false;
    let canvasTool = 'pen';
    let canvasCtx = null;

    const SOUNDSCAPES = [
      { id: 'rain', name: 'Rain & Thunder', icon: 'fa-cloud-showers-heavy', type: 'noise' },
      { id: 'fire', name: 'Cozy Fireplace', icon: 'fa-fire', type: 'crackle' },
      { id: 'waves', name: 'Ocean Waves', icon: 'fa-water', type: 'waves' },
      { id: 'space', name: 'Deep Space', icon: 'fa-user-astronaut', type: 'space' },
      { id: 'forest', name: 'Forest Night', icon: 'fa-tree', type: 'forest' }
    ];

    let photoGallery = [
      "https://images.unsplash.com/photo-1518173946687-a4c8a383392e?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80"
    ];

    window.onload = function() {
      const hash = window.location.hash;
      if (hash && hash.includes('room=')) {
        roomCode = hash.split('room=')[1].split('&')[0];
        isHost = false;
      } else {
        roomCode = "sync-" + Math.random().toString(36).substring(2, 8);
        window.location.hash = `room=${roomCode}`;
        isHost = true;
      }

      document.getElementById('currentRoomDisplay').innerText = roomCode;
      initPeerConnection();
      initAmbientGrid();
      initSketchpad();
      renderPhotoGallery();
    };

    function initPeerConnection() {
      // If we are host, we create a predictable peer id based on room code. If client, we use a random id and connect to host.
      const myId = isHost ? `syncspace-host-${roomCode}` : `syncspace-client-${Math.random().toString(36.substring(2, 6))}`;
      
      peer = new Peer(myId);

      peer.on('open', (id) => {
        console.log('My P2P ID:', id);
        if (!isHost) {
          connectToHost(`syncspace-host-${roomCode}`);
        } else {
          document.getElementById('syncStatusDot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
          document.getElementById('p2pBadge').innerText = "Hosting Room";
          document.getElementById('p2pBadge').className = "text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-medium border border-emerald-500/20";
          appendSystemMessage("Room hosted! Share the link with your partner.");
        }
      });

      peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        setupConnectionHandlers();
        document.getElementById('syncStatusDot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        document.getElementById('p2pBadge').innerText = "Peer Connected";
        document.getElementById('p2pBadge').className = "text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-medium border border-emerald-500/20";
        appendSystemMessage("Partner connected successfully!");
      });

      peer.on('error', (err) => {
        console.warn("Peer error (retrying as client if host ID taken):", err);
        if (err.type === 'unavailable-ID' && isHost) {
          // Room already hosted, join as client instead
          isHost = false;
          peer.destroy();
          initPeerConnection();
        }
      });
    }

    function connectToHost(hostId) {
      appendSystemMessage("Connecting to host...");
      conn = peer.connect(hostId);
      conn.on('open', () => {
        setupConnectionHandlers();
        document.getElementById('syncStatusDot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        document.getElementById('p2pBadge').innerText = "Connected to Room";
        document.getElementById('p2pBadge').className = "text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-medium border border-emerald-500/20";
        appendSystemMessage("Successfully joined partner's room!");
      });
    }

    function setupConnectionHandlers() {
      conn.on('data', (data) => {
        handleIncomingData(data);
      });
      conn.on('close', () => {
        document.getElementById('syncStatusDot').className = "w-2 h-2 rounded-full bg-rose-500";
        document.getElementById('p2pBadge').innerText = "Disconnected";
        appendSystemMessage("Partner disconnected.");
      });
    }

    function sendData(payload) {
      if (conn && conn.open) {
        conn.send(payload);
      }
    }

    function handleIncomingData(data) {
      if (data.type === 'chat') {
        appendChatMessage(data.user, data.text);
      } else if (data.type === 'video') {
        isSyncing = true;
        if (ytPlayer && isYoutubeReady) {
          ytPlayer.loadVideoById(data.videoId, data.currentTime);
          if (data.isPlaying) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
        }
        setTimeout(() => { isSyncing = false; }, 800);
      } else if (data.type === 'stroke') {
        drawLineLocally(data.x0, data.y0, data.x1, data.y1, data.color, data.size);
      } else if (data.type === 'clear') {
        const canvas = document.getElementById('sketchCanvas');
        if (canvasCtx && canvas) canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      } else if (data.type === 'photos') {
        photoGallery = data.photos;
        renderPhotoGallery();
      }
    }

    // --- CHAT & MESSAGING ---
    function sendChatMessage(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('chatInput');
      if (!input || !input.value.trim()) return;
      const text = input.value.trim();
      input.value = '';

      appendChatMessage(currentUser, text);
      sendData({ type: 'chat', user: currentUser, text: text });
    }

    function appendChatMessage(user, text) {
      const stream = document.getElementById('chatStream');
      if (!stream) return;
      const div = document.createElement('div');
      div.className = "bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs space-y-1";
      div.innerHTML = `<div class="font-semibold text-indigo-300">${user}</div><div class="text-slate-200">${text}</div>`;
      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight;
    }

    function appendSystemMessage(text) {
      const stream = document.getElementById('chatStream');
      if (!stream) return;
      const div = document.createElement('div');
      div.className = "text-center text-[10px] text-slate-500 my-1 font-mono uppercase tracking-widest";
      div.innerText = `--- ${text} ---`;
      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight;
    }

    // --- YOUTUBE PLAYER & SYNC ---
    function onYouTubeIframeAPIReady() {
      try {
        ytPlayer = new YT.Player('youtubePlayer', {
          height: '100%', width: '100%', videoId: 'jfKfPfyJRdk',
          events: {
            'onReady': () => { isYoutubeReady = true; },
            'onStateChange': onYouTubeStateChange
          }
        });
      } catch(e) {}
    }

    function onYouTubeStateChange(event) {
      if (isSyncing || !ytPlayer) return;
      if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.PAUSED) {
        try {
          const payload = {
            type: 'video',
            videoId: ytPlayer.getVideoUrl().match(/[?&]v=([^&]+)/)[1],
            isPlaying: (event.data === YT.PlayerState.PLAYING),
            currentTime: ytPlayer.getCurrentTime()
          };
          sendData(payload);
        } catch(e) {}
      }
    }

    function loadUniversalVideo() {
      const inputElem = document.getElementById('videoUrlInput');
      if (!inputElem) return;
      const input = inputElem.value.trim();
      if (!input) return;
      if (input.includes('youtube.com') || input.includes('youtu.be')) {
        let videoId = input.includes('youtu.be/') ? input.split('youtu.be/')[1].split('?')[0] : input.split('watch?v=')[1].split('&')[0];
        if (ytPlayer && isYoutubeReady) ytPlayer.loadVideoById(videoId);
        sendData({ type: 'video', videoId: videoId, isPlaying: true, currentTime: 0 });
      }
    }

    function loadPreset(type, val) {
      if (type === 'youtube' && ytPlayer) {
        ytPlayer.loadVideoById(val);
        sendData({ type: 'video', videoId: val, isPlaying: true, currentTime: 0 });
      }
    }

    // --- CANVAS SKETCHPAD ---
    function initSketchpad() {
      const canvas = document.getElementById('sketchCanvas');
      if (!canvas) return;
      canvasCtx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth || 800;
      canvas.height = canvas.parentElement.clientHeight || 500;

      canvas.onmousedown = (e) => { isDrawing = true; window.lastX = e.offsetX / canvas.width; window.lastY = e.offsetY / canvas.height; };
      canvas.onmousemove = (e) => {
        if (!isDrawing) return;
        let x = e.offsetX / canvas.width, y = e.offsetY / canvas.height;
        let cp = document.getElementById('canvasColorPicker');
        let sw = document.getElementById('canvasLineWidth');
        let color = canvasTool === 'eraser' ? '#0f172a' : (cp ? cp.value : '#6366f1');
        let size = sw ? sw.value : 4;
        drawLineLocally(window.lastX, window.lastY, x, y, color, size);
        sendData({ type: 'stroke', x0: window.lastX, y0: window.lastY, x1: x, y1: y, color: color, size: size });
        window.lastX = x; window.lastY = y;
      };
      canvas.onmouseup = () => { isDrawing = false; };
      canvas.onmouseleave = () => { isDrawing = false; };
    }

    function drawLineLocally(x0, y0, x1, y1, color, size) {
      if (!canvasCtx) return;
      const canvas = document.getElementById('sketchCanvas');
      if (!canvas) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(x0 * canvas.width, y0 * canvas.height);
      canvasCtx.lineTo(x1 * canvas.width, y1 * canvas.height);
      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = size;
      canvasCtx.lineCap = 'round';
      canvasCtx.stroke();
    }

    function clearCanvas() {
      const canvas = document.getElementById('sketchCanvas');
      if (canvasCtx && canvas) canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      sendData({ type: 'clear' });
    }

    function setCanvasTool(tool) {
      canvasTool = tool;
      document.getElementById('tool-pen').className = tool === 'pen' ? "p-2 bg-indigo-600 text-white rounded-lg text-xs" : "p-2 bg-slate-800 text-slate-300 rounded-lg text-xs";
      document.getElementById('tool-eraser').className = tool === 'eraser' ? "p-2 bg-indigo-600 text-white rounded-lg text-xs" : "p-2 bg-slate-800 text-slate-300 rounded-lg text-xs";
    }

    // --- PHOTO GALLERY & MISC ---
    function renderPhotoGallery() {
      const grid = document.getElementById('photoGrid');
      if (!grid) return;
      grid.innerHTML = '';
      photoGallery.forEach(url => {
        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl overflow-hidden border border-slate-800 aspect-video";
        card.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
        grid.appendChild(card);
      });
    }

    function addPhotoToGallery() {
      const input = document.getElementById('photoUrlInput');
      if (!input || !input.value.trim()) return;
      photoGallery.push(input.value.trim());
      input.value = '';
      renderPhotoGallery();
      sendData({ type: 'photos', photos: photoGallery });
    }

    function sendBedtimeNote() {
      const input = document.getElementById('bedtimeNoteInput');
      if (!input || !input.value.trim()) return;
      const txt = `🌙 Bedtime Note: ${input.value.trim()}`;
      appendChatMessage(currentUser, txt);
      sendData({ type: 'chat', user: currentUser, text: txt });
      input.value = '';
      switchTab('watch');
    }

    function switchTab(tabId) {
      ['watch', 'sketch', 'bedtime', 'photowall'].forEach(t => {
        const view = document.getElementById(`view-${t}`);
        const tab = document.getElementById(`tab-${t}`);
        if(view) view.classList.add('hidden');
        if(tab) tab.className = "nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400";
      });
      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      document.getElementById(`tab-${tabId}`).className = "nav-tab active px-4 py-1.5 rounded-lg text-sm font-medium bg-indigo-600 text-white";

      if (tabId === 'sketch') {
        setTimeout(() => {
          const canvas = document.getElementById('sketchCanvas');
          if (canvas && canvas.parentElement) {
            canvas.width = canvas.parentElement.clientWidth || 800;
            canvas.height = canvas.parentElement.clientHeight || 500;
          }
        }, 50);
      }
    }

    function copyShareLink() {
      const url = `${window.location.origin}${window.location.pathname}#room=${roomCode}`;
      navigator.clipboard.writeText(url);
      alert(`P2P Room Link Copied!\nSend this link to your partner:\n${url}`);
    }

    function openRoomModal() { document.getElementById('roomModal').classList.remove('hidden'); }
    function closeRoomModal() { document.getElementById('roomModal').classList.add('hidden'); }

    function applyRoomChange() {
      const room = document.getElementById('modalRoomInput').value.trim();
      const name = document.getElementById('modalNameInput').value.trim();
      if (room) roomCode = room.toLowerCase().replace(/\s+/g, '-');
      if (name) currentUser = name;
      window.location.hash = `room=${roomCode}`;
      closeRoomModal();
      window.location.reload();
    }

    function sendHeartbeat() {
      const txt = "❤️ Sent a heartbeat pulse!";
      appendChatMessage(currentUser, txt);
      sendData({ type: 'chat', user: currentUser, text: txt });
    }

    function updateMoodStatus() {
      const mood = document.getElementById('userMoodInput').value.trim();
      if (mood) {
        const txt = `✨ Status update: ${mood}`;
        appendChatMessage(currentUser, txt);
        sendData({ type: 'chat', user: currentUser, text: txt });
      }
    }

    // Audio context dummy handlers for ambient sound engine
    function getAudioContext() { return new (window.AudioContext || window.webkitAudioContext)(); }
    function toggleAmbientSound(id) { alert("Ambient sound playing locally."); }
    function toggleMasterMute() {}
    function setSoundTimer() {}
  </script>
</body>
