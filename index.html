<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncSpace - Co-Working, Watch Together & Ambient Sound Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f4ff', 100: '#e0e9ff', 400: '#818cf8',
              500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #0b0f19, #030712);
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.7); }
  </style>

  <!-- Firebase Compatibility Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="h-full text-slate-100 flex flex-col overflow-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Application Main Shell -->
  <div id="app" class="h-full flex flex-col relative z-10">
    
    <!-- Top Bar -->
    <header class="glass-panel h-16 px-4 md:px-6 flex items-center justify-between shrink-0 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-cubes text-xl text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide text-white flex items-center gap-2">
            SyncSpace <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-normal">v2.5</span>
          </h1>
          <p class="text-xs text-slate-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Room Code: <span id="currentRoomDisplay" class="font-mono text-indigo-300 font-semibold uppercase">MAIN-ROOM</span>
          </p>
        </div>
      </div>

      <!-- Center View Tabs -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800/80">
        <button onclick="switchTab('watch')" id="tab-watch" class="nav-tab active px-4 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-2 bg-indigo-600 text-white shadow-sm">
          <i class="fa-solid fa-circle-play"></i> Watch Together
        </button>
        <button onclick="switchTab('sketch')" id="tab-sketch" class="nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-paintbrush"></i> Canvas & Notes
        </button>
        <button onclick="switchTab('bedtime')" id="tab-bedtime" class="nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-moon"></i> Sleep Zone
        </button>
        <button onclick="switchTab('photowall')" id="tab-photowall" class="nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-images"></i> Photo Gallery
        </button>
      </nav>

      <!-- Quick Room Actions -->
      <div class="flex items-center gap-2 md:gap-3">
        <button onclick="sendHeartbeat()" class="p-2.5 rounded-xl bg-pink-500/10 hover:bg-pink-500/20 text-pink-400 border border-pink-500/20 transition hover:scale-105" title="Send Heartbeat Pulse">
          <i class="fa-solid fa-heart animate-pulse"></i>
        </button>

        <button id="voiceToggleBtn" onclick="toggleVoiceCall()" class="px-3 py-1.5 rounded-xl text-xs md:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-2">
          <i id="voiceIcon" class="fa-solid fa-microphone-slash text-rose-400"></i>
          <span id="voiceStatusText" class="hidden sm:inline">Voice Call</span>
        </button>

        <button onclick="copyShareLink()" class="px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30 transition flex items-center gap-2">
          <i class="fa-solid fa-share-nodes"></i>
          <span class="hidden sm:inline">Share Link</span>
        </button>

        <button onclick="openRoomModal()" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Room Options">
          <i class="fa-solid fa-right-to-bracket text-lg"></i>
        </button>
      </div>
    </header>

    <!-- Main Workspace Frame -->
    <div class="flex-1 flex overflow-hidden">

      <!-- Left Sidebar: Web Audio Sound Engine -->
      <aside class="w-80 glass-panel shrink-0 border-r border-slate-800/80 flex flex-col hidden lg:flex">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <h2 class="font-semibold text-slate-200 flex items-center gap-2 text-sm uppercase tracking-wider">
            <i class="fa-solid fa-sliders text-indigo-400"></i> Ambient Soundscapes
          </h2>
          <button id="masterMuteBtn" onclick="toggleMasterMute()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition text-xs" title="Mute/Unmute All">
            <i id="masterMuteIcon" class="fa-solid fa-volume-high"></i>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- Sleep Timer -->
          <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400 flex items-center gap-1.5">
                <i class="fa-solid fa-hourglass-half text-indigo-400"></i> Sleep Fade Timer
              </span>
              <span id="timerDisplay" class="font-mono text-indigo-300 font-semibold">Off</span>
            </div>
            <div class="grid grid-cols-4 gap-1.5">
              <button onclick="setSoundTimer(15)" class="py-1 px-2 rounded bg-slate-800 hover:bg-indigo-600/30 text-[11px] text-slate-300 transition">15m</button>
              <button onclick="setSoundTimer(30)" class="py-1 px-2 rounded bg-slate-800 hover:bg-indigo-600/30 text-[11px] text-slate-300 transition">30m</button>
              <button onclick="setSoundTimer(60)" class="py-1 px-2 rounded bg-slate-800 hover:bg-indigo-600/30 text-[11px] text-slate-300 transition">60m</button>
              <button onclick="setSoundTimer(0)" class="py-1 px-2 rounded bg-slate-800 hover:bg-rose-600/30 text-[11px] text-slate-300 transition">Off</button>
            </div>
          </div>

          <!-- Ambient Tracks List -->
          <div id="ambientSoundGrid" class="space-y-3"></div>
        </div>

        <!-- Room Vibe & Mood Sync -->
        <div class="p-4 border-t border-slate-800 bg-slate-950/40">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Set Room Status / Mood</label>
          <div class="flex items-center gap-2">
            <input type="text" id="userMoodInput" placeholder="Study time, chillin'..." class="bg-slate-900 border border-slate-800 text-xs text-slate-200 px-3 py-2 rounded-xl flex-1 focus:outline-none focus:border-indigo-500">
            <button onclick="updateMoodStatus()" class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs transition">
              <i class="fa-solid fa-check"></i>
            </button>
          </div>
        </div>
      </aside>

      <!-- Center Dynamic Viewport -->
      <main class="flex-1 bg-slate-950/20 relative overflow-hidden flex flex-col">

        <!-- Mobile Navigation Switcher -->
        <div class="flex md:hidden items-center justify-around bg-slate-900 border-b border-slate-800 p-2 shrink-0 text-xs">
          <button onclick="switchTab('watch')" id="mob-tab-watch" class="px-3 py-1.5 rounded-lg font-medium bg-indigo-600 text-white">Watch</button>
          <button onclick="switchTab('sketch')" id="mob-tab-sketch" class="px-3 py-1.5 rounded-lg font-medium text-slate-400">Sketchpad</button>
          <button onclick="switchTab('bedtime')" id="mob-tab-bedtime" class="px-3 py-1.5 rounded-lg font-medium text-slate-400">Sleep</button>
          <button onclick="switchTab('photowall')" id="mob-tab-photowall" class="px-3 py-1.5 rounded-lg font-medium text-slate-400">Photos</button>
        </div>

        <!-- View 1: Watch Together -->
        <div id="view-watch" class="view-panel flex-1 flex flex-col p-4 md:p-6 overflow-y-auto space-y-4">
          <div class="glass-card p-4 rounded-2xl border border-slate-800 flex flex-col lg:flex-row gap-3 items-center justify-between">
            <div class="w-full lg:w-auto flex-1 flex flex-col sm:flex-row gap-2">
              <div class="relative flex-1">
                <i class="fa-solid fa-link absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="videoUrlInput" placeholder="Paste YouTube link OR direct video URL (.mp4, .webm, .m3u8)" class="w-full bg-slate-900 border border-slate-800 text-slate-200 text-sm pl-10 pr-4 py-2.5 rounded-xl focus:outline-none focus:border-indigo-500">
              </div>
              <button onclick="loadUniversalVideo()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition shrink-0 flex items-center justify-center gap-2">
                <i class="fa-solid fa-satellite-dish"></i> Sync Stream
              </button>
            </div>

            <!-- Presets -->
            <div class="w-full lg:w-auto flex items-center gap-1.5 overflow-x-auto pb-1 lg:pb-0 text-xs">
              <span class="text-slate-400 font-medium shrink-0">Presets:</span>
              <button onclick="loadPreset('youtube', 'jfKfPfyJRdk')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition shrink-0"><i class="fa-brands fa-youtube text-red-400"></i> Lofi Girl</button>
              <button onclick="loadPreset('youtube', 'TURbeWK2wwg')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition shrink-0"><i class="fa-brands fa-youtube text-red-400"></i> Rain Stream</button>
              <button onclick="loadPreset('mp4', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition shrink-0"><i class="fa-solid fa-file-video text-indigo-400"></i> MP4 Demo</button>
            </div>
          </div>

          <!-- Video Display Player -->
          <div class="flex-1 min-h-[300px] md:min-h-[440px] bg-black rounded-2xl overflow-hidden shadow-2xl relative border border-slate-800/80 flex items-center justify-center">
            <div id="youtubePlayerContainer" class="w-full h-full">
              <div id="youtubePlayer" class="w-full h-full"></div>
            </div>
            <div id="html5PlayerContainer" class="w-full h-full hidden bg-black flex flex-col items-center justify-center relative">
              <video id="nativeVideoPlayer" class="w-full h-full object-contain" controls>
                <source id="nativeVideoSource" src="" type="video/mp4">
              </video>
            </div>
          </div>
        </div>

        <!-- View 2: Canvas -->
        <div id="view-sketch" class="view-panel flex-1 hidden p-4 md:p-6 flex flex-col h-full overflow-hidden">
          <div class="glass-card p-3 rounded-2xl border border-slate-800 mb-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <label class="text-xs text-slate-400 font-medium">Tool:</label>
              <button onclick="setCanvasTool('pen')" id="tool-pen" class="p-2 bg-indigo-600 text-white rounded-lg text-xs transition"><i class="fa-solid fa-pen"></i> Pen</button>
              <button onclick="setCanvasTool('eraser')" id="tool-eraser" class="p-2 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-lg text-xs transition"><i class="fa-solid fa-eraser"></i> Eraser</button>
              <div class="h-4 w-px bg-slate-700 mx-1"></div>
              <label class="text-xs text-slate-400 font-medium">Color:</label>
              <input type="color" id="canvasColorPicker" value="#6366f1" class="w-7 h-7 rounded bg-transparent cursor-pointer border-0">
              <div class="h-4 w-px bg-slate-700 mx-1"></div>
              <label class="text-xs text-slate-400 font-medium">Size:</label>
              <input type="range" id="canvasLineWidth" min="1" max="30" value="4" class="w-20 accent-indigo-500">
            </div>
            <button onclick="clearCanvas()" class="px-3 py-1.5 bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 rounded-xl text-xs font-medium border border-rose-500/30 transition flex items-center gap-1.5">
              <i class="fa-solid fa-trash"></i> Clear Canvas
            </button>
          </div>
          <div class="flex-1 bg-slate-900/90 rounded-2xl border border-slate-800 relative overflow-hidden flex items-center justify-center">
            <canvas id="sketchCanvas" class="w-full h-full cursor-crosshair block"></canvas>
          </div>
        </div>

        <!-- View 3: Bedtime -->
        <div id="view-bedtime" class="view-panel flex-1 hidden p-4 md:p-6 overflow-y-auto space-y-6">
          <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center max-w-xl mx-auto space-y-5 my-auto">
            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center text-3xl mx-auto">
              <i class="fa-solid fa-moon"></i>
            </div>
            <div>
              <h2 class="text-xl font-bold text-slate-100">Bedtime & Relaxation Space</h2>
              <p class="text-sm text-slate-400 mt-1">Wind down together with procedural soundscapes & goodnight messages.</p>
            </div>
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-left space-y-3">
              <label class="text-xs font-semibold text-slate-300 uppercase block">Send Goodnight / Morning Note</label>
              <textarea id="bedtimeNoteInput" rows="2" placeholder="Sweet dreams! See you tomorrow..." class="w-full bg-slate-950 border border-slate-800 text-xs text-slate-200 p-3 rounded-xl focus:outline-none focus:border-indigo-500"></textarea>
              <button onclick="sendBedtimeNote()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Post Note
              </button>
            </div>
          </div>
        </div>

        <!-- View 4: Photos -->
        <div id="view-photowall" class="view-panel flex-1 hidden p-4 md:p-6 overflow-y-auto space-y-4">
          <div class="glass-card p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="w-full sm:w-auto flex-1 flex gap-2">
              <input type="text" id="photoUrlInput" placeholder="Paste image link URL..." class="w-full bg-slate-900 border border-slate-800 text-slate-200 text-sm px-4 py-2 rounded-xl focus:outline-none focus:border-indigo-500">
              <button onclick="addPhotoToGallery()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition shrink-0 flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Add Photo
              </button>
            </div>
          </div>
          <div id="photoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

      </main>

      <!-- Right Sidebar: Room Chat -->
      <aside class="w-80 glass-panel shrink-0 border-l border-slate-800/80 flex flex-col">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <h2 class="font-semibold text-slate-200 flex items-center gap-2 text-sm uppercase tracking-wider">
            <i class="fa-solid fa-comments text-indigo-400"></i> Room Chat
          </h2>
          <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-medium border border-emerald-500/20">Live Sync</span>
        </div>
        <div id="chatStream" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <form onsubmit="sendChatMessage(event)" class="p-3 border-t border-slate-800 bg-slate-950/40 flex items-center gap-2">
          <input type="text" id="chatInput" placeholder="Type a message..." class="bg-slate-900 border border-slate-800 text-xs text-slate-200 px-3 py-2.5 rounded-xl flex-1 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="p-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs transition">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </aside>

    </div>
  </div>

  <!-- Room Options Modal -->
  <div id="roomModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-panel w-full max-w-md p-6 rounded-2xl border border-slate-800 space-y-5">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-door-open text-indigo-400"></i> Join / Switch Room
        </h3>
        <button onclick="closeRoomModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase block mb-1">Room Code</label>
          <input type="text" id="modalRoomInput" placeholder="e.g. study-hub-123" class="w-full bg-slate-900 border border-slate-800 text-sm text-slate-200 px-3.5 py-2.5 rounded-xl focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase block mb-1">Display Name</label>
          <input type="text" id="modalNameInput" placeholder="e.g. Alex" class="w-full bg-slate-900 border border-slate-800 text-sm text-slate-200 px-3.5 py-2.5 rounded-xl focus:outline-none focus:border-indigo-500">
        </div>
      </div>
      <button onclick="applyRoomChange()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition">Enter Room</button>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Global Application Code -->
  <script>
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyAUsydn3vR0rxcjxpwnkhr_AGM6LjIW894",
      authDomain: "longdistance-330d0.firebaseapp.com",
      databaseURL: "https://longdistance-330d0-default-rtdb.firebaseio.com",
      projectId: "longdistance-330d0",
      storageBucket: "longdistance-330d0.firebasestorage.app",
      messagingSenderId: "114298454958",
      appId: "1:114298454958:web:fc9cdc4b772dbf897a3e3f"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch(e) { console.error("Firebase init error", e); }
    const database = firebase.database();

    // --- GLOBAL VARIABLES ---
    let currentRoom = "main-room";
    let currentUser = "User_" + Math.floor(100 + Math.random() * 900);
    let masterMuted = false;
    let timerInterval = null;
    let timerSecondsRemaining = 0;
    let audioCtx = null;
    const ambientNodes = {};
    let ytPlayer = null;
    let isYoutubeReady = false;
    let isSyncing = false;
    let isDrawing = false;
    let canvasTool = 'pen';
    let canvasCtx = null;

    const SOUNDSCAPES = [
      { id: 'rain', name: 'Rain & Thunder', icon: 'fa-cloud-showers-heavy', type: 'noise' },
      { id: 'fire', name: 'Cozy Fireplace', icon: 'fa-fire', type: 'crackle' },
      { id: 'waves', name: 'Ocean Waves', icon: 'fa-water', type: 'waves' },
      { id: 'space', name: 'Deep Space', icon: 'fa-user-astronaut', type: 'space' },
      { id: 'forest', name: 'Forest Night', icon: 'fa-tree', type: 'forest' }
    ];

    let photoGallery = [
      "https://images.unsplash.com/photo-1518173946687-a4c8a383392e?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80"
    ];

    // --- INITIALIZATION ---
    window.onload = function() {
      try {
        const hash = window.location.hash;
        if (hash && hash.includes('room=')) {
          currentRoom = hash.split('room=')[1].split('&')[0];
        } else {
          currentRoom = "room-" + Math.random().toString(36).substring(2, 8);
          window.location.hash = `room=${currentRoom}`;
        }
        
        const disp = document.getElementById('currentRoomDisplay');
        if (disp) disp.innerText = currentRoom;

        initAmbientGrid();
        initSketchpad();
        renderPhotoGallery();
        initFirebaseSync();
      } catch(err) {
        console.error("Initialization error:", err);
      }
    };

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // --- 1. SOUND ENGINE ---
    function initAmbientGrid() {
      const container = document.getElementById('ambientSoundGrid');
      if (!container) return;
      container.innerHTML = '';
      SOUNDSCAPES.forEach(snd => {
        const card = document.createElement('div');
        card.className = "glass-card p-3 rounded-xl border border-slate-800/80 flex flex-col gap-2";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-200"><i class="fa-solid ${snd.icon} mr-1 text-indigo-400"></i> ${snd.name}</span>
            <button onclick="toggleAmbientSound('${snd.id}')" id="btn-${snd.id}" class="p-1.5 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">Play</button>
          </div>
          <input type="range" min="0" max="1" step="0.01" value="0.5" id="vol-${snd.id}" oninput="setAmbientVolume('${snd.id}', this.value)" class="w-full accent-indigo-500 h-1 bg-slate-800 rounded">
        `;
        container.appendChild(card);
      });
    }

    function toggleAmbientSound(id) {
      if (ambientNodes[id] && ambientNodes[id].playing) {
        stopProceduralSound(id);
      } else {
        startProceduralSound(id);
      }
    }

    function startProceduralSound(id) {
      const ctx = getAudioContext();
      const soundDef = SOUNDSCAPES.find(s => s.id === id);
      if (!soundDef) return;

      const masterGain = ctx.createGain();
      const volInput = document.getElementById(`vol-${id}`);
      masterGain.gain.value = masterMuted ? 0 : (volInput ? parseFloat(volInput.value) : 0.5);
      masterGain.connect(ctx.destination);

      let cleanupFunc = null;
      if (soundDef.type === 'noise') {
        const bufferSize = ctx.sampleRate * 2;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;
        noise.connect(filter);
        filter.connect(masterGain);
        noise.start();
        cleanupFunc = () => { noise.stop(); };
      } else {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 140;
        osc.connect(masterGain);
        osc.start();
        cleanupFunc = () => { osc.stop(); };
      }

      ambientNodes[id] = { playing: true, gainNode: masterGain, cleanup: cleanupFunc };
      const btn = document.getElementById(`btn-${id}`);
      if(btn) {
        btn.innerText = "Pause";
        btn.className = "p-1.5 px-3 rounded-lg bg-indigo-600 text-white text-xs transition";
      }
    }

    function stopProceduralSound(id) {
      if (ambientNodes[id]) {
        if (ambientNodes[id].cleanup) ambientNodes[id].cleanup();
        ambientNodes[id].playing = false;
      }
      const btn = document.getElementById(`btn-${id}`);
      if(btn) {
        btn.innerText = "Play";
        btn.className = "p-1.5 px-3 rounded-lg bg-slate-800 text-slate-300 text-xs transition";
      }
    }

    function setAmbientVolume(id, val) {
      if (ambientNodes[id] && ambientNodes[id].gainNode) {
        ambientNodes[id].gainNode.gain.value = masterMuted ? 0 : parseFloat(val);
      }
    }

    function toggleMasterMute() {
      masterMuted = !masterMuted;
      const icon = document.getElementById('masterMuteIcon');
      if(icon) icon.className = masterMuted ? "fa-solid fa-volume-xmark text-rose-400" : "fa-solid fa-volume-high";
    }

    function setSoundTimer(mins) {
      clearInterval(timerInterval);
      const tDisp = document.getElementById('timerDisplay');
      if (mins <= 0) { if(tDisp) tDisp.innerText = "Off"; return; }
      timerSecondsRemaining = mins * 60;
      timerInterval = setInterval(() => {
        timerSecondsRemaining--;
        if(tDisp) tDisp.innerText = Math.floor(timerSecondsRemaining/60) + "m";
        if (timerSecondsRemaining <= 0) {
          clearInterval(timerInterval);
          SOUNDSCAPES.forEach(s => stopProceduralSound(s.id));
        }
      }, 1000);
    }

    function onYouTubeIframeAPIReady() {
      try {
        ytPlayer = new YT.Player('youtubePlayer', {
          height: '100%', width: '100%', videoId: 'jfKfPfyJRdk',
          events: {
            'onReady': () => { isYoutubeReady = true; },
            'onStateChange': onYouTubeStateChange
          }
        });
      } catch(e) { console.error("YT init error", e); }

    function onYouTubeStateChange(event) {
      if (isSyncing || !ytPlayer) return;
      if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.PAUSED) {
        try {
          database.ref(`rooms/${currentRoom}/videoState`).set({
            type: 'youtube',
            videoId: ytPlayer.getVideoUrl().match(/[?&]v=([^&]+)/)[1],
            isPlaying: (event.data === YT.PlayerState.PLAYING),
            currentTime: ytPlayer.getCurrentTime(),
            timestamp: Date.now()
          });
        } catch(e) {}
      }
    }

    function loadUniversalVideo() {
      const inputElem = document.getElementById('videoUrlInput');
      if (!inputElem) return;
      const input = inputElem.value.trim();
      if (!input) return;
      if (input.includes('youtube.com') || input.includes('youtu.be')) {
        let videoId = input.includes('youtu.be/') ? input.split('youtu.be/')[1].split('?')[0] : input.split('watch?v=')[1].split('&')[0];
        if (ytPlayer && isYoutubeReady) ytPlayer.loadVideoById(videoId);
        database.ref(`rooms/${currentRoom}/videoState`).set({ type: 'youtube', videoId: videoId, isPlaying: true, currentTime: 0, timestamp: Date.now() });
      }
    }

    function loadPreset(type, val) {
      if (type === 'youtube' && ytPlayer) {
        ytPlayer.loadVideoById(val);
        database.ref(`rooms/${currentRoom}/videoState`).set({ type: 'youtube', videoId: val, isPlaying: true, currentTime: 0, timestamp: Date.now() });
      }
    }

    // --- 3. CANVAS SKETCHPAD ---
    function initSketchpad() {
      const canvas = document.getElementById('sketchCanvas');
      if (!canvas) return;
      canvasCtx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth || 800;
      canvas.height = canvas.parentElement.clientHeight || 500;

      canvas.onmousedown = (e) => { isDrawing = true; window.lastX = e.offsetX / canvas.width; window.lastY = e.offsetY / canvas.height; };
      canvas.onmousemove = (e) => {
        if (!isDrawing) return;
        let x = e.offsetX / canvas.width, y = e.offsetY / canvas.height;
        let cp = document.getElementById('canvasColorPicker');
        let sw = document.getElementById('canvasLineWidth');
        let color = canvasTool === 'eraser' ? '#0f172a' : (cp ? cp.value : '#6366f1');
        let size = sw ? sw.value : 4;
        drawLineLocally(window.lastX, window.lastY, x, y, color, size);
        database.ref(`rooms/${currentRoom}/canvasStrokes`).push({ x0: window.lastX, y0: window.lastY, x1: x, y1: y, color: color, size: size });
        window.lastX = x; window.lastY = y;
      };
      canvas.onmouseup = () => { isDrawing = false; };
      canvas.onmouseleave = () => { isDrawing = false; };
    }

    function drawLineLocally(x0, y0, x1, y1, color, size) {
      if (!canvasCtx) return;
      const canvas = document.getElementById('sketchCanvas');
      if (!canvas) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(x0 * canvas.width, y0 * canvas.height);
      canvasCtx.lineTo(x1 * canvas.width, y1 * canvas.height);
      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = size;
      canvasCtx.lineCap = 'round';
      canvasCtx.stroke();
    }

    function clearCanvas() {
      const canvas = document.getElementById('sketchCanvas');
      if (canvasCtx && canvas) canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      database.ref(`rooms/${currentRoom}/canvasStrokes`).push({ action: 'clear' });
    }

    function setCanvasTool(tool) {
      canvasTool = tool;
      const tPen = document.getElementById('tool-pen');
      const tEraser = document.getElementById('tool-eraser');
      if(tPen) tPen.className = tool === 'pen' ? "p-2 bg-indigo-600 text-white rounded-lg text-xs" : "p-2 bg-slate-800 text-slate-300 rounded-lg text-xs";
      if(tEraser) tEraser.className = tool === 'eraser' ? "p-2 bg-indigo-600 text-white rounded-lg text-xs" : "p-2 bg-slate-800 text-slate-300 rounded-lg text-xs";
    }
